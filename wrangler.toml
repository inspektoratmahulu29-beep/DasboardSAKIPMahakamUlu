# Cloudflare Pages project name
name = "sakip-cloudflare"

# Output directory for static assets
pages_build_output_dir = "public"

# ============================================================
# BINDING D1 DATABASE
# ============================================================
# Ganti database_id dengan ID database D1 Anda (di dashboard Cloudflare)
[[d1_databases]]
binding = "DB"
database_name = "sakip_db"
database_id = "your-d1-database-id-here"   # <<< GANTI dengan ID D1 Anda

# ============================================================
# BINDING R2 BUCKET
# ============================================================
[[r2_buckets]]
binding = "EVIDENCE_BUCKET"
bucket_name = "sakip-evidence"

# ============================================================
# VARIABEL LINGKUNGAN (Non-secret)
# ============================================================
[vars]
ACCESS_PASSWORD = "PMandiriAkip2027"         # Password PM
INSP_PASSWORD = "SakipInspektoraT2027"       # Password Inspektorat
DELETE_PASSWORD = "JanganHapus2027"          # Password hapus tahun/OPD
GOOGLE_DRIVE_FOLDER_ID = "your-google-drive-folder-id"   # Folder Drive tujuan backup

# ============================================================
# CATATAN:
# GOOGLE_DRIVE_CLIENT_ID, GOOGLE_DRIVE_CLIENT_SECRET, GOOGLE_DRIVE_REFRESH_TOKEN
# sebaiknya disimpan sebagai SECRET (bukan vars) karena sangat sensitif.
# Cara set via CLI: wrangler secret put GOOGLE_DRIVE_CLIENT_ID
# atau melalui dashboard Cloudflare > Pages > Settings > Environment variables.
# ============================================================
